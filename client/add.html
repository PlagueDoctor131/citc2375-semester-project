<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Music Collection and Suggestions</title>
  <link rel="stylesheet" href="css/styles.css">
  
</head>
<body>
  <header class="content-width">
    <h1>Music Collection and Suggestions</h1>
    <nav>
    <a href="index.html">Home Page</a>
    <a href="about.html">About</a>
    <a href="add.html">Add Music</a>
    </nav>
  </header>
  <main>
    <form class="form" id="add-music-form">
        <h1>Add Music to the List</h1>

        <label for="Art">Song/Album Name:</label>
        <input type="text" id="Art" name="Art" required><br>

        <label for="Genre">Genre:</label>
        <input type="text" id="Genre" name="Genre" required><br>

        <label for="Category">Category:</label>
        <input type="text" id="Category" name="Category" required><br>

        <label for="Image">Image:</label>
        <input type="file" id="Image" name="Image" required><br>

        <label for="Description">Description:</label>
        <textarea id="Description" name="Description" required></textarea><br>

        <label for="Link">Link:</label>
        <input type="url" id="Link" name="Link" required><br>

        <label for="Adder">Your Name:</label>
        <input type="text" id="Adder" name="Adder" required><br>

        <input type="submit" action="#" value="Add Music">
    </form>
  </main>
  <footer></footer>
</body>

</html>
