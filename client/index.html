<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Collection and Suggestions</title>
  <link rel="stylesheet" href="css/styles.css">
  
</head>
<body>
  <header class="content-width">
    <h1>Music Collection and Suggestions</h1>
    <nav>
    <a href="index.html">Home Page</a>
    <a href="about.html">About</a>
    <a href="add.html">Add Music</a>
  </nav>
  </header>
  
  <main>
    <p id="preamble">This is my CITC 2375 semester project. It's for collection and doing music suggestions!</p>
  </main>
  <button type="button" id="filter-button" onclick="toggleFilterControls()">Filter</button>
  <div id="filter-controls" class="hidden" style="background:#fff; padding:7px; border-radius:6px; box-shadow:0 0 5px #aaa;">
    <h3>Filter Controls</h3>
    <label for="name-filter">Name</label>
    <input type="text" id="name-filter" style="width:25%">
    <label for="genre-filter">Genre</label>
    <select id="genre-filter">
      <option>Select one</option>
      <option>Soul/R&B</option>
      <option>Indie/Alternative</option>
      <option>Jazz Rap</option>
    </select>
    <label for="category-filter">Category</label>
    <select id="category-filter">
      <option>Select one</option>
      <option>Albums</option>
      <option>Tiny Desk Set</option>
    </select>
    <button type="submit" id="submit-filters">Submit</button>
  </div>
  <div id="Music-Collection" class="container"></div>

  <footer></footer>



  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
